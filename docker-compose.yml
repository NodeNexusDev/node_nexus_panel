services:
  panel:
    image: ghcr.io/nodenexusdev/node_nexus_panel:latest
    container_name: node-nexus-panel
    ports:
      - "8080:8080"
    networks:
      - app_net
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    image: ghcr.io/nodenexusdev/node_nexus_api:latest
    container_name: node-nexus-api
    ports:
      - "${HOST_PORT:-8000}:${PORT:-8000}"
    env_file: .env
    volumes:
      - known_hosts:/app/.ssh
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, os; req = urllib.request.Request('http://localhost:8000/health', headers={'X-API-Key': os.environ['MASTER_API_KEY']}); urllib.request.urlopen(req, timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    tmpfs:
      - /tmp

  db:
    image: postgres:16
    container_name: node-nexus-db
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app_net:
    driver: bridge

volumes:
  known_hosts:
  postgres_data:
