name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find version tag in pushed commits
        id: find_tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for SHA in $(git rev-list ${{ github.event.before }}..${{ github.sha }}); do
            TAG=$(git tag --points-at "$SHA" 2>/dev/null | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
            if [ -n "$TAG" ]; then
              echo "Found tag: $TAG on commit $SHA"
              echo "tag=$TAG" >> $GITHUB_OUTPUT
              echo "skip=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          done

          for TAG in $(git tag --merged "${{ github.sha }}" --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$'); do
            STATUS=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
            if [ "$STATUS" = "404" ]; then
              echo "Found unreleased tag: $TAG"
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              echo "skip=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$STATUS" != "200" ]; then
              echo "Unable to check release $TAG: GitHub API returned HTTP $STATUS"
              exit 1
            fi
          done

          echo "No version tag found in pushed commits, skipping release"
          echo "skip=true" >> "$GITHUB_OUTPUT"

      - name: Verify release version
        if: steps.find_tag.outputs.skip == 'false'
        env:
          RELEASE_TAG: ${{ steps.find_tag.outputs.tag }}
        run: |
          TAG_VERSION="$RELEASE_TAG"
          TAG_VERSION="${TAG_VERSION#v}"
          PROJECT_VERSION=$(git show "$RELEASE_TAG:package.json" | jq -r '.version')
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match package.json version $PROJECT_VERSION"
            exit 1
          fi

      - name: Setup Node.js
        if: steps.find_tag.outputs.skip == 'false'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.find_tag.outputs.skip == 'false'
        run: npm ci

      - name: Build
        if: steps.find_tag.outputs.skip == 'false'
        run: npm run build

      - name: Check out release tag
        if: steps.find_tag.outputs.skip == 'false'
        run: git checkout --detach "${{ steps.find_tag.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.find_tag.outputs.skip == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.find_tag.outputs.tag }}
          generate_release_notes: true
          files: dist/*
